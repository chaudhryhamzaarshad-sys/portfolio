<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="index,follow">
<title>Hamza Arshad, MBA | Supply Chain Portfolio</title>
<style>
html,body{margin:0;min-height:100%;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#0b1726;color:#fff}body{display:grid;place-items:center}.loader{width:min(520px,calc(100% - 40px));text-align:center}.mark{width:54px;height:54px;border-radius:16px;background:#fff;color:#0b1726;display:grid;place-items:center;margin:0 auto 18px;font-weight:900;letter-spacing:.08em}.title{font-size:26px;font-weight:900;letter-spacing:-.03em}.copy{color:#aebfca;font-size:14px;margin-top:8px}.bar{height:4px;background:#17313c;border-radius:999px;overflow:hidden;margin-top:22px}.bar:after{content:"";display:block;width:38%;height:100%;background:#34c3ad;border-radius:999px;animation:load 1.1s ease-in-out infinite}@keyframes load{0%{transform:translateX(-110%)}100%{transform:translateX(320%)}}.error{display:none;color:#ffd4d4;margin-top:18px;font-size:13px;line-height:1.6}
</style>
</head>
<body>
<div class="loader" id="loader"><div class="mark">HA</div><div class="title">Loading portfolio</div><div class="copy">Preparing the interactive visual portfolio…</div><div class="bar"></div><div class="error" id="error">The portfolio could not be loaded. Please refresh the page.</div></div>
<script>
(async()=>{
  const base='https://raw.githubusercontent.com/chaudhryhamzaarshad-sys/portfolio/main/.site/';
  const parts=['p01.b64','p02.b64','p03.b64','p04.b64','p05.b64'];
  try{
    if(!('DecompressionStream' in window)) throw new Error('Browser does not support gzip decompression');
    const texts=await Promise.all(parts.map(async p=>{const r=await fetch(base+p+'?v=20260823',{cache:'no-store'});if(!r.ok)throw new Error('Failed '+p);return r.text();}));
    const b64=texts.join('').replace(/\s+/g,'');
    const bin=atob(b64);
    const bytes=new Uint8Array(bin.length);
    for(let i=0;i<bin.length;i++)bytes[i]=bin.charCodeAt(i);
    const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));
    const html=await new Response(stream).text();
    if(!html.includes('id="visuals"')||!html.includes('Transformation Dashboard'))throw new Error('Portfolio validation failed');
    document.open();document.write(html);document.close();
  }catch(e){console.error(e);document.getElementById('error').style.display='block';document.querySelector('.bar').style.display='none';}
})();
</script>
</body>
</html>
