name: Deploy portfolio to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build premium visual portfolio
        shell: bash
        run: |
          set -euo pipefail
          cat .site/p*.b64 | tr -d '\n\r ' | base64 --decode | gzip -dc > index.html
          grep -q 'id="visuals"' index.html
          grep -q 'Transformation Dashboard' index.html
          grep -q 'id="additional-experience"' index.html
          grep -q 'aria-label="Instagram"' index.html
          grep -q 'Cloudflare' index.html

      - name: Persist premium portfolio to main for Vercel
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if ! git diff --cached --quiet; then
            git commit -m "Deploy premium visual portfolio"
            git push origin HEAD:main
          else
            echo "Premium portfolio is already stored in index.html"
          fi

      - name: Build downloadable resume
        shell: bash
        run: |
          set -u
          rm -f Hamza_Arshad_Resume.pdf resume.tmp.pdf
          if compgen -G '.resume/c*.b64' > /dev/null; then
            if cat .resume/c*.b64 | tr -d '\n\r ' | base64 --decode > resume.tmp.pdf 2>/dev/null \
              && test -s resume.tmp.pdf \
              && test "$(head -c 4 resume.tmp.pdf)" = "%PDF"; then
              mv resume.tmp.pdf Hamza_Arshad_Resume.pdf
            else
              rm -f resume.tmp.pdf Hamza_Arshad_Resume.pdf
              echo 'Resume reconstruction failed; site deployment will continue without a broken PDF.'
            fi
          fi
          rm -rf .resume .site

      - name: Add favicon
        shell: bash
        run: |
          if [ ! -f favicon.svg ]; then
            cat > favicon.svg <<'SVG'
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64"><rect width="64" height="64" rx="16" fill="#0b1726"/><text x="32" y="40" text-anchor="middle" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#ffffff">HA</text></svg>
          SVG
          fi

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
