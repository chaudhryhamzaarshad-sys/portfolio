name: Deploy portfolio to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare approved portfolio and existing live resume
        shell: bash
        run: |
          set -euo pipefail
          # index.html is the approved source; do not overwrite it with the legacy archive.
          grep -q 'id="hamza-executive"' index.html
          grep -q 'id="visual-impact"' index.html
          grep -q 'The impact observatory' index.html
          grep -q 'id="additional-experience"' index.html
          grep -q 'Instagram' index.html
          grep -q 'Cloudflare' index.html
          grep -q 'Hamza_Arshad_Resume.pdf' index.html
          # Preserve the PDF currently served by hamzaarshad.me, byte for byte.
          test "$(head -c 4 Hamza_Arshad_Resume.pdf)" = "%PDF"
          echo "855e4b6508c83340ed56c320755259de859355f3ed501b3230b486021e1a1269  Hamza_Arshad_Resume.pdf" | sha256sum -c -
          mkdir -p _site
          cp index.html Hamza_Arshad_Resume.pdf CNAME _site/
          if [ -f favicon.svg ]; then cp favicon.svg _site/; fi
          touch _site/.nojekyll

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
