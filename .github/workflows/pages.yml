name: Deploy portfolio to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build approved premium portfolio
        shell: bash
        run: |
          set -euo pipefail
          cat .site/p01.b64 .site/p02.b64 .site/p03.b64 .site/p04.b64 .site/p05.b64 | tr -d '\n\r ' | base64 --decode | gzip -dc > index.html
          grep -q 'id="visuals"' index.html
          grep -q 'Transformation Dashboard' index.html
          grep -q 'id="additional-experience"' index.html
          grep -q 'aria-label="Instagram"' index.html
          grep -q 'Cloudflare' index.html

      - name: Attach exact uploaded resume
        shell: bash
        run: |
          set -euo pipefail
          gzip -dc .resume_exact/uploaded-resume.pdf.gz > Hamza_Arshad_Resume_20260824_014348.pdf
          test -s Hamza_Arshad_Resume_20260824_014348.pdf
          test "$(head -c 4 Hamza_Arshad_Resume_20260824_014348.pdf)" = "%PDF"
          echo "b9c93cc0473124cb6da95b260962c9f5a050c8bc3789a51a9f279be3061eb521  Hamza_Arshad_Resume_20260824_014348.pdf" | sha256sum -c -
          cp Hamza_Arshad_Resume_20260824_014348.pdf Hamza_Arshad_Resume.pdf
          sed -i 's/Hamza_Arshad_Resume\.pdf/Hamza_Arshad_Resume_20260824_014348.pdf/g' index.html
          grep -q 'Hamza_Arshad_Resume_20260824_014348.pdf' index.html
          rm -rf .site .resume .resume_exact .resume_fixed .resume_web

      - name: Add favicon
        shell: bash
        run: |
          if [ ! -f favicon.svg ]; then
            cat > favicon.svg <<'SVG'
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64"><rect width="64" height="64" rx="16" fill="#0b1726"/><text x="32" y="40" text-anchor="middle" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#ffffff">HA</text></svg>
          SVG
          fi

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
